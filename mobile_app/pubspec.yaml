name: mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  camera: 0.10.5+9
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  google_mlkit_face_detection: ^0.12.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  supabase_flutter: ^2.18.3
  drift: ^2.35.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.6
  path: ^1.9.1
  connectivity_plus: ^7.3.2
  uuid: ^4.6.0
  intl: ^0.20.3
  image_picker: ^1.2.4
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

